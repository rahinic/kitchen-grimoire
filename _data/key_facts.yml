- text: "CO2 comes from yeast eating sugar. Bacteria make lactic acid for tang and lower pH."
  source: claude
- text: "Don't ferment ginger beer to dryness. Leftover sugar carbonates the bottle. Refrigerate while sugar remains."
  source: claude
- text: "Burp swing-tops slowly over a sink. A PET bottle alongside shows pressure by going rock hard."
  source: claude
- text: "Don't clamp the jar during the first ferment. Use a cloth or an unclamped lid."
  source: claude
- text: "Botulism needs pH above 4.6. Ginger beer is expected around pH 3-3.5."
  source: claude
- text: "Fuzzy mold on the surface means discard. Flat white film is harmless yeast."
  source: claude
- text: "Short ferments give about 0.3-1% ABV. Over 0.5% isn't non-alcoholic in the EU."
  source: claude
- text: "Turmeric in the bug is fine in small amounts, about 1 tsp per 2 tbsp ginger."
  source: claude
- text: "Non-organic ginger still gave a healthy ferment (GBR.001)."
  source: me
- text: "A large tea towel draping the jar and blocking light was fine for GBR.001."
  source: me
- text: "A bug should drop below pH 4 within a few days. A reading stuck around 4-5 together with an off smell means restart."
  source: claude
- text: "Feed a small ginger bug about 1 tsp sugar and 1 tsp ginger a day. Too much sugar makes a thick syrup that can stall the yeast."
  source: claude
- text: "Syrup thins when diluted with water. Ropy bacterial slime stays stretchy and stringy."
  source: claude
- text: "Rejected a bug for off smell, high pH and slime risk despite texture improving."
  source: me
- text: "Stopped using the electronic pH meter: calibration was unreliable and readings were doubtful. Using analog pH strips (pass/fail below about pH 4) plus smell and look."
  source: me
- text: "1 tbsp ginger + 1 tbsp sugar in 250 ml is a standard ratio for a ginger bug."
  source: claude
- text: "Sugar is the yeast's food. Too much builds a thick syrup that slows yeast and favors ropy bacteria. Too little starves it and lets mold in."
  source: claude
- text: "Ropy slime comes from bacteria turning sucrose into dextran. It is harmless but unpleasant."
  source: claude
- text: "Keep ginger submerged. Pieces above the liquid dry out and grow mold."
  source: claude
- text: "Ambient room temperature is 20-22°C in winter and is not adjustable. Expect bubbles on day 3-5."
  source: me
